[bar]
scale = 0.800000011920929
module-gap = 1.0
bg = "transparent"
border-color = "transparent"
rounding = "full"
button-label-size = 1.100000023841858
button-label-weight = "bold"
button-rounding = "md"
button-border-location = "none"

[[bar.layout]]
monitor = "*"
show = true
left = [
    "dashboard",
    "hyprland-workspaces",
    "netstat",
    "window-title",
]
center = ["clock"]
right = [
    "systray",
    "volume",
    "brightness",
    "ram",
    "cpu",
    "battery",
]

[styling.palette]
bg = "#16161e"
surface = "#1a1b26"
elevated = "#292e42"
fg = "#c0caf5"
fg-muted = "#a9b1d6"
primary = "#7aa2f7"
red = "#f7768e"
yellow = "#e0af68"
green = "#9ece6a"
blue = "#7dcfff"

[wallpaper]
engine-enabled = false
